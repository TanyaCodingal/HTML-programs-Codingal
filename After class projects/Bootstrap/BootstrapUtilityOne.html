<html>
    <head>
        <title>
            Bootstrap Utilities-Part 1
        </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
        </script>
    </head>
    <body style="text-align: center;">
        <h1>Jumbotron and Buttons</h1>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1 style="color: red;">Harry Potter fan club</h1>
                <p>Where Harry Potter fans assemble</p>
            </div>
        </div>
        <div class="container">
            <p>Hogwarts houses :</p>
            <button type="button" class="btn btn-danger" style="color:yellow">
                Gryffindor
            </button>
            <button type="button" class="btn btn-warning">
                Hufflepuff
            </button>
            <button type="button" class="btn btn-primary">
                Ravenclaw
            </button>
            <button type="button" class="btn btn-success" style="color:white">
                Slytherin
            </button>
        </div>
        <br><br><br><br><br>
        <h1>Badges</h1>
        <span class="badge badge-success">
            Slytherin 
            <span style="background-color: aliceblue; color:green">
                Snape
            </span>
        </span>
        <br>
        <span class="badge badge-primary">
            Ravenclaw 
            <span style="background-color: aliceblue; color:blue">
                Flitwick
            </span>
        </span>
        <br>
        <span class="badge badge-warning">
            Hufflepuff <span style="background-color: aliceblue; color:yellow">
                Sprout
            </span>
        </span>
        <br>
        <span class="badge badge-danger">
            Gryffindor 
            <span style="background-color: aliceblue; color:red">
                McGonagall
            </span>
        </span>
        <h1 style="color: chocolate; text-align: center;"> Cards </h1> 
       <div class="container">
            <div class="card" style="width: 14rem;">
                <img class="card-img-top" src="Screenshot 2026-02-19 203231.png">
                <div class="card-body">
                    <h5 class="card-title">
                        Harry Potter
                    </h5>
                    <p clas="card-text">
                        The Boy who Lived
                    </p>
                    <a href="#" class="btn btn-danger">
                        More details
                    </a>
                </div>
            </div>
       </div>
    </body>
</html>
