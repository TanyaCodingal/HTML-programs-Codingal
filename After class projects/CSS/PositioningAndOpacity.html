<html>
    <head>
        <title>
            Positioning and Opacity in CSS
        </title>
        <style>
            div{
                right: 30px;
                border: 5px solid black;
                margin-top: 10px;
            }
            .a{
               position: absolute; 
               left: 100px;
               border-color: forestgreen;
               color: blue;
            }
            .r{
                position: relative;
            }
            .f{
                position: fixed;
            }
            .s{
                position: sticky
            }
            p{
                background-color:rgb(86, 86, 255);
                padding: 10px;
                margin: 3px;
            }
            .o{
                opacity: 0.1;
            }
            .t{
                opacity: 0.3;
            }
           .h{
            opacity: 0.6;
           }
        </style>
    </head>
    <body>
        POSITIONING :
        <div>
            Div with no position
        </div>
        <div class="s">
            Div with sticky position
        </div>
        <div class="a">
            Div with absolute position
        </div>
        <div class="r">
            Div with relative position
        </div>
        <div class="f">
            Div with fixed position
        </div>
        <p class="o">Opacity 0.1</p>
        <p class="t">Opacity 0.3</p>
        <p class="h">Opacity 0.6</p>
        <p class="th">Opacity 1 (default) </p>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
