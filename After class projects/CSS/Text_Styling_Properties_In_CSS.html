<html>
    <head>
        <title>
            Text Styling Properties in CSS
        </title>
        <style>
            .ty{
                background-color: aquamarine;
                font-size: 100px;
                font-family: French Script MT;
                color: ivory;
            }
            div{
                height: 100px;
                width: 300px;
                background-color: rgb(131, 0, 254);
                color: white;
                border: 2px solid rgb(53, 52, 52);
                margin: 7px;
            }
            #R{
                transform: rotatex(180deg);
            }
            #text{
                text-shadow: 2px 2px 1px yellow;
            }
            #box{
                box-shadow: 9px 9px 5px hotpink;
            }
            #TI{
                text-indent: 50%;
            }
            h2{
                text-transform: uppercase;
                text-decoration: underline;
            }
            h3{
                text-transform: none;
                text-decoration: overline;
            }
            h4{
                text-transform: lowercase;
                text-decoration: overline underline;
            }
            h5{
                text-transform: lowercase;
                text-decoration: line-through;
            }
        </style>
    </head>
    <body>
        Typography :-
        <p class="ty">Typography GRABS the user's attention</p>
        Rotation :-
        <div>TANYA</div>
        <div id="R">TANYA</div>
        <h1 id="text">Text shadow effect</h1>
        <h1 id="box">Box shadow effect</h1>
        <p id="TI">Text Indenting</p>
        Text Transformation and Decoration:
        <h2>tanya</h2>
        <h3>Tanya</h3>
        <h4>TaNyA</h4>
        <h5>TANYA</h5>
    </body>
</html>
