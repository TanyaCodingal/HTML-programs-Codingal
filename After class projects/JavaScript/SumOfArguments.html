<html>
    <body>
        <script>
            function FindMax(){
                var i=0;
                max=0;
                for(i=0; i<arguments.length;i++){
                    if(arguments[i]>max){
                        max=arguments[i]
                    }
                }
                return max;
            }
            document.write(FindMax(23,432,123456,99999999,100000,0))
        </script>
    </body>
</html>
