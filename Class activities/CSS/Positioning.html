<html>
    <head>
        <title>
            Positioning Text in CSS
        </title>
        <style>
            div{
                right: 30px;
                border: 5px solid black;
                margin-top: 10px;
            }
            .a{
               position: absolute; 
               left: 100px;
               border-color: forestgreen;
               color: blue;
            }
            .r{
                position: relative;
            }
            .f{
                position: fixed;
            }
            .s{
                position: sticky
            }
        </style>
    </head>
    <body>
        <div>
            Div with no position
        </div>
        <div class="s">
            Div with sticky position
        </div>
        <div class="a">
            Div with absolute position
        </div>
        <div class="r">
            Div with relative position
        </div>
        <div class="f">
            Div with fixed position
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
