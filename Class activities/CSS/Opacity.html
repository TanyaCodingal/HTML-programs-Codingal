<html>
    <head>
        <title>
            Opacity in HTML
        </title>
        <style>
            div{
                background-color:chocolate;
                padding: 10px;
                margin: 3px;
            }
            .o{
                opacity: 0.1;
            }
            .t{
                opacity: 0.3;
            }
           .h{
            opacity: 0.6;
           }
        </style>
    </head>
    <body>
        <div class="o">Opacity 0.1</div>
        <div class="t">Opacity 0.3</div>
        <div class="h">Opacity 0.6</div>
        <div class="th">Opacity 1 (default) </div>
    </body>
</html>
