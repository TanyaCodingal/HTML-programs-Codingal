<html>
    <head>
        <title>
            Float in CSS
        </title>
        <style>
            #fr{
                float: right;
            }
            #fl{
                float: left;
            }
        </style>
    </head>
    <body>
        <p>
            <img src="Screenshot 2026-01-18 190805.png" id="fr" style="height: 120px; width: 100px;">
            <img src="Screenshot 2026-01-18 190805.png" id="fl" style="height: 120px; width: 100px;">
            Above flower will be placed right to left in this content
        </p>
    </body>
</html>
