<html>
    <body onload="showTime()">
        <h1>Time Display:</h1>
        <br>
        <h2>Time :-</h2>
        <div id="myClockDisplay"></div>
        <br>

        <script>
            function showTime(){
                var date=new Date();
                var h=date.getHours();
                var m=date.getMinutes();
                var s=date.getSeconds();
                var session="a.m."

                if(h>12){
                    h=h-12;
                    session="p.m.";
                }

                h=(h<10)?"0"+h:h;
                m=(m<10)?"0"+m:m;
                s=(s<10)?"0"+s:s;

                var time=h+":"+m+":"+s+""+session; 
                document.getElementById("myClockDisplay").innerText=time;
                setTimeout(showTime,1000);
            }
        </script>
    </body>
</html>
