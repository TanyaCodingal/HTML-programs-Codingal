<html>
    <body>
        <script>
            var abs = Math.abs(-5)
            document.write("Absolute value of -5 : "+abs)
            document.write("<br>")
            document.write("Power : "+Math.pow(5,67))
            document.write("<br>")
            document.write("Square root : "+Math.sqrt(567))
            document.write("<br>")
            document.write("Maximum : "+Math.max(3,2,34,567,100032))
            document.write("<br>")
            document.write("Minimum : "+Math.min(3,2,34,567,100032))
        </script>
    </body>
</html>
