<html>
    <head>
    </head>

    <body>

        <h2>Add items to the To-Do list.</h2>
        <form id="myForm">
            <input id="myInput" type="text">
            <button>Add item</button>
        </form>
        
        <h2>To-Do List :</h2>
        <ul id="myItem"></ul>

        <script>
            var myForm=document.getElementById("myForm");
            var myInput=document.getElementById("myInput");
            var myItem=document.getElementById("myItem");

            myForm.addEventListener("submit",function(event){
                event.preventDefault();
                createItem(myInput.value);
            })

            function createItem(inputItems){
                var item=`<li>${inputItems};
                <button onclick="deleteElement(this)">Delete</button></li>`
                myItem.insertAdjacentHTML("beforeend",item);
                myInput.value="";
                myInput.focus();
            }

            function deleteElement(ElementToBeDeleted){
                ElementToBeDeleted.parentElement.remove();
            }
        </script>
    </body>
</html>
