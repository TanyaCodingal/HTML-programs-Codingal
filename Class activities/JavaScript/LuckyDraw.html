<html>
    <head>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background: teal;
                text-align: center;
                padding: 30px;
            }
            h1{
                color: navajowhite;
            }
            input{
                padding: 8px;
                margin: 5px;
                border: 2px solid navajowhite;
                border-radius: 6px;
                width: 220px;
            }
            button{
                background-color: navajowhite;
                color: blue;
                padding: 10px 25px;
                border-radius: 20px;
                border: none;
                cursor: pointer;
            }
            #timer{
                color: greenyellow;
            }
        </style>
    </head>
    <body>
        <h1>---LUCKY DRAW---</h1>
        <p>Enter your name and guess the number to win!</p>
        <input type="text" id="name" placeholder="Your name" required><br>
        <p id="msg-name"></p>
        <input type="number" id="guess" placeholder="Guess the number (1-5)" required><br>
        <p id="msg-guess"></p>
        <button onclick="checkForm()">Try my Luck!!</button>
        <p id="result"></p>
        <p id="timer"></p>
        <script>
            var seconds=0;
            setInterval(function(){
                seconds=seconds+1
                document.getElementById("timer").textContent="You have been here for "+seconds+" seconds"
            },1000);
            function checkForm(){
                var name=document.getElementById("name").value;
                var guess=document.getElementById("guess").value;
                var ok=true;
                if (name==""){
                    document.getElementById("mgs-name").textContent="Please enter your name";
                    document.getElementById("msg-name").style.color="red";
                    ok=false;
                }
                else{
                    document.getElementById("msg-name").textContent="Great Name!"
                    document.getElementById("msg-name").style.color="aliceblue"
                }
                if (guess==""){
                    document.getElementById("mgs-guess").textContent="Please enter your guess";
                    document.getElementById("msg-guess").style.color="red";
                    ok=false;
                }
                else{
                    document.getElementById("msg-guess").textContent="Guess Saved!"
                    document.getElementById("msg-guess").style.color="aliceblue"
                }
                if (ok==true){
                    var lucky=Math.floor(Math.random()*5)+1;
                    if (guess==lucky){
                        document.getElementById("result").textContent="You won "+name+"! The lucky number was "+lucky+"!"
                        document.getElementById("result").style.color="yellowgreen"
                    }
                    else{
                        document.getElementById("result").textContent="Oops! Bad luck "+name+"! The lucky number was "+lucky+"! Come on, try again!!"
                        document.getElementById("result").style.color="red"

                    }
                }
            }
        </script>
    </body>
</html>
