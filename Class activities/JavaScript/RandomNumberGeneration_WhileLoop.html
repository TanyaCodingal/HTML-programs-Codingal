<html>
    <head>
    </head>
    <body>
        <h1>WHILE LOOP</h1>
        <br>
        <br>
        <br>
        <p id="demo">
        </p>
        <script>
            var i=0;
            var text="";
            while(i<10){
                text=text+"<br> The number is "+i;
                i=i+2;                
            }
            document.getElementById("demo").innerHTML=text
        </script>
    </body>
</html>
