<html>
    <body>
        <p id="join"></p>
        <p id="pop"></p>
        <p id="pop2"></p>
        <p id="push"></p>
        <script>
            var colors=["Blue","Red","Purple"];
            document.getElementById("join").innerHTML=colors.join(", ");
            document.getElementById("pop").innerHTML=colors.pop();
            document.getElementById("pop2").innerHTML=colors;
            document.getElementById("pop2").innerHTML=colors.push("Pink")    
            document.getElementById("push").innerHTML=colors       
        </script>
    </body>
</html>
