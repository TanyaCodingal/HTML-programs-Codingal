<html>
    <head>
    </head>
    <body>
        <p id="demo"></p>
        <script>
            class car{
                constructor(brand){
                    this.carbrand=brand
                }
                present(){
                    return "I have a "+this.carbrand;
                }
            }
            class Model extends car{
                constructor(brand,model){
                    super(brand);
                    this.model=model;
                }
                show(){
                    return this.present()+", it is a "+this.model;
                }
            }
            let ob=new Model("Ford","Mustang");
            document.getElementById("demo").innerHTML=ob.show();
        </script>
    </body>
</html>
