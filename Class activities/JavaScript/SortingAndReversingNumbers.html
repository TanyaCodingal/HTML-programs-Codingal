<html>
    <body>
        <p>Click on any button to sort the array in either ascending or descending</p>
        <button onclick="ascending()">ASCENDING</button>
        <button onclick="descending()">DESCENDING</button>
        <p id="result"></p>
        <script>
            var points=[10,4,45,33,2,21,14];
            document.getElementById("result").innerHTML=points;
            function ascending(){
                points.sort(function(a,b){
                    return a-b;
                });
                document.getElementById("result").innerHTML=points;
            }
            function descending(){
                points.sort(function(a,b){
                    return b-a;
                });
                document.getElementById("result").innerHTML=points;
            }
        </script>
    </body>
</html>
