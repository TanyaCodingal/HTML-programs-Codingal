<html>
    <head>
        <title>
            Mark and Code
        </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
        </script>
    </head>
    <body>
        <p>CO<sub>2</sub></p>
        <p>24<sup>2</sup></p>
        <div class="container">
            <p>The <mark>MARK</mark> tag is used to <mark>highlight</mark> the <mark>required statement</mark>.</p>
        </div>
        <div class="container">
            <p>The following HTML elements <code>span</code>, <code>div</code> and <code>section</code> are used to divide the entire document into sections.</p>
        </div>
    </body>
</html>
