<html>
    <head>
        <title>
            Cards in Bootstrap
        </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
        </script>
    </head>
    <body>
       <h1 style="color: chocolate; text-align: center;"> Harry Potter </h1> 
       <div class="container">
            <div class="card" style="width: 14rem;">
                <img class="card-img-top" src="Screenshot 2026-02-19 203231.png">
                <div class="card-body">
                    <h5 class="card-title">
                        Harry Potter
                    </h5>
                    <p clas="card-text">
                        The Boy who Lived
                    </p>
                    <a href="#" class="btn btn-danger">
                        More details
                    </a>
                </div>
            </div>
       </div>
    </body>
</html>
