<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kids Learning Hub</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="Style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <section id="home">
            <div id="heroSlider" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="2"></button>
                </div>
                <div class="carousel-inner">
                    <!--Slider 1-->
                    <div class="carousel-item active">
                        <img src="images/Slider1.png" class="d-block w-100 slider-img" alt="slider 1">
                        <div class="carousel-caption">
                            <h1>Welcome to Kids Learning Hub</h1>
                            <p>Learn..Grow...and Explore!!</p>
                            <a href="#courses" class="btn btn-warning btn-lg px-4">Explore Courses</a>
                        </div>                        
                    </div>
                    <!--Slider 2-->
                    <div class="carousel-item">
                        <img src="images/Slider2.png" class="d-block w-100 slider-img" alt="slider 2">
                        <div class="carousel-caption">
                            <h1>Fun Learning Activities!</h1>
                            <p>Interactive learning with our Games and Quizzes</p>
                            <a href="#about" class="btn btn-warning btn-lg px-4">Learn More</a>
                        </div>                        
                    </div>
                    <!--Slider 3-->
                    <div class="carousel-item">
                        <img src="images/Slider3.png" class="d-block w-100 slider-img" alt="slider 3">
                        <div class="carousel-caption">
                            <h1>Learn Coding Effortlessly!!</h1>
                            <p>HTML.....CSS......JavaScript......Bootstrap.....And more!!</p>
                            <a href="#contact" class="btn btn-warning btn-lg px-4">Join Today</a>
                        </div>                        
                    </div>
                </div>
                <!--Carousel Buttons-->
                <button class="carousel-control-prev" type="button" data-bs-target="#heroSlider" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#heroSlider" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>
    </body>
</html>
